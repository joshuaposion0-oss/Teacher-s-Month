<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher's Month</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="start">
        <button onclick="showSurprise()">CLICK ME</button>
    </div>


    <div id="surprise">

        <div class="card">

            <h1>Happy Teacher's Month!</h1>

            <p class="message">
                Thank you for teaching, guiding, and inspiring us.
                We truly appreciate all your hard work and patience.
                Happy Teacher's Month, Ma'am/Sir!
            </p>

            <img src="teacher.jpg" class="teacher-picture">

            <audio id="music" controls>
                <source src="song.mp3" type="audio/mpeg">
            </audio>

        </div>

    </div>


    <script>

        function showSurprise() {

            document.getElementById("start").style.display = "none";

            document.getElementById("surprise").style.display = "flex";

            document.querySelector(".card").classList.add("show");

            document.getElementById("music").play();

        }

    </script>

</body>
</html>
